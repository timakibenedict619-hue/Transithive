<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolute Logistics | Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, sans-serif;
  }
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
    overflow: hidden;
    position: relative;
  }
  /* Subtle floating orbs */
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.25;
    pointer-events: none;
  }
  .orb-1 {
    width: 400px;
    height: 400px;
    background: #3B82F6;
    top: -100px;
    left: -100px;
  }
  .orb-2 {
    width: 300px;
    height: 300px;
    background: #2563EB;
    bottom: -80px;
    right: -80px;
  }
  .login-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 440px;
    background: #1E293B;
    border-radius: 24px;
    padding: 48px 40px;
    border: 1px solid #334155;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
  }
  .logo-circle {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: white;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
  }
  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #F8FAFC;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #94A3B8;
    font-size: 15px;
    margin-bottom: 36px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 14px;
    color: #CBD5E1;
  }
  .input-group {
    position: relative;
    margin-bottom: 22px;
  }
  .input-group i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748B;
    font-size: 15px;
  }
  input {
    width: 100%;
    padding: 15px 16px 15px 46px;
    background: #0F172A;
    border: 1px solid #334155;
    border-radius: 12px;
    font-size: 15px;
    color: #F1F5F9;
    outline: none;
    transition: all 0.25s ease;
  }
  input::placeholder {
    color: #64748B;
  }
  input:focus {
    border-color: #3B82F6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
  .btn-login {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: white;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
  }
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(59, 130, 246, 0.4);
  }
  .btn-login:active {
    transform: translateY(0);
  }
  #error {
    margin-top: 18px;
    text-align: center;
    color: #F87171;
    font-size: 14px;
    min-height: 20px;
  }
  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 13px;
    color: #64748B;
  }
  .footer a {
    color: #3B82F6;
    text-decoration: none;
  }
  @media (max-width: 480px) {
    .login-card {
      margin: 20px;
      padding: 36px 24px;
    }
  }
</style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="login-card">
    <div class="logo-circle">
      <i class="fa-solid fa-truck-fast"></i>
    </div>
    <h1>Resolute Logistics</h1>
    <p class="subtitle">Administrator Portal</p>
    <form id="loginForm" onsubmit="return false;">
      <div class="input-group">
        <label for="email">Email Address</label>
        <i class="fa-solid fa-envelope"></i>
        <input 
          type="email" 
          id="email" 
          placeholder="admin@transithive.com"
          autocomplete="username"
          required
        >
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <i class="fa-solid fa-lock"></i>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        Sign In
      </button>
    </form>
    <p id="error"></p>
    <div class="footer">
      © 2026 Resolute Logistics. All Rights Reserved.
    </div>
  </div>
  <script type="module" src="admin-login.js"></script>
</body>
</html>
